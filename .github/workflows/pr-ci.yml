name: PR CI

on:
  pull_request:
    branches: [feat/delta-table]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # The runner skips installation and Rust only for allowlisted Markdown.
      # Install system libraries before non-documentation checks via the same classifier.
      - name: Install Linux dependencies when needed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: python
        run: |
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from quality_gate import changed_paths, documentation_only
          comparison = os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]
          if not documentation_only(changed_paths([comparison])):
              subprocess.run(["sudo", "apt-get", "update"], check=True)
              subprocess.run(["sudo", "apt-get", "install", "-y", "build-essential", "pkg-config", "libasound2-dev", "libudev-dev", "libxkbcommon-dev"], check=True)

      - name: Quality Gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/quality_gate.py --mode full --online --allow-docs-only --base "$BASE_SHA" --head "$HEAD_SHA" --require automated
